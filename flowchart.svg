<path d="M556 325 H606" class="arrow"/>
<path d="M804 325 H834 V274 H854" class="arrow"/>
<path d="M804 325 H834 V408 H854" class="arrow"/>
<path d="M804 325 H834 V527 H854" class="arrow"/>
<path d="M1106 274 H1136 V341 H1164" class="arrow"/>
<path d="M1106 408 H1136 V361 H1164" class="arrow"/>
<path d="M1106 527 H1136 V386 H1164" class="arrow"/>
<path d="M1172 438 H1128 V548 H616 V420 H298" class="arrow"/>
<text x="458" y="476" class="small">decision · action · explanation</text>

<rect x="48" y="642" width="426" height="172" rx="22" fill="#ffffff" stroke="#a9c6d4" stroke-width="1.5"/>
<text x="80" y="686" class="head">Fraud analyst dashboard</text>
<text x="80" y="716" class="body">Live decisions · reasons · model evidence</text>
<text x="80" y="744" class="body">Privacy panel · case note status</text>
<text x="80" y="780" class="small">GET /decisions · /report · /case/{id}</text>
<path d="M1270 438 V625 H262 V634" class="arrow"/>

<rect x="520" y="642" width="836" height="172" rx="22" fill="#fffaf0" stroke="#e5d8b8" stroke-width="1.5"/>
<text x="552" y="680" class="lane" style="fill:#8b6c34">ASYNC · HIGH / CRITICAL ONLY</text>
<rect x="552" y="704" width="340" height="80" rx="14" fill="#ffffff" stroke="#dfcea6" stroke-width="1.5"/>
<text x="576" y="737" class="head">Granite note + validator</text>
<text x="576" y="763" class="body">Optional mode · fixed facts · strict format</text>
<rect x="984" y="704" width="332" height="80" rx="14" fill="#ffffff" stroke="#dfcea6" stroke-width="1.5"/>
<text x="1008" y="737" class="head">Template fallback</text>
<text x="1008" y="763" class="body">Default after 0/50 Granite acceptance</text>
<path d="M1260 436 V614 H722 V696" class="async"/>
<path d="M892 744 H974" class="async"/>
<path d="M984 784 V830 H262 V822" class="async"/>
<text x="64" y="864" class="small">Case notes receive the allow-listed fact sheet only; names, account numbers and raw transaction IDs are excluded.</text>
</svg>
