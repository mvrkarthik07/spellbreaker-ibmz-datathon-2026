<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="960" viewBox="0 0 1540 960" role="img" aria-labelledby="title desc">
  <title id="title">How SpellBreaker checks a transfer</title>
  <desc id="desc">A transfer moves through context gathering, three risk checks and a clear bank action. High-risk cases can get an optional, validated case note, and decisions appear on the analyst dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#41677a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#a87527"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172b3a; letter-spacing: -0.5px; }
      .subtitle { font: 18px Arial, sans-serif; fill: #526c7c; }
      .lane { font: 700 15px Arial, sans-serif; fill: #496577; letter-spacing: 1px; }
      .card-title { font: 700 19px Arial, sans-serif; fill: #1d3342; }
      .body { font: 15px Arial, sans-serif; fill: #405d6e; }
      .small { font: 13px Arial, sans-serif; fill: #547080; }
      .arrow { fill: none; stroke: #41677a; stroke-width: 3; marker-end: url(#arrow); }
      .async { fill: none; stroke: #a87527; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-amber); }
    </style>
  </defs>

  <rect width="1540" height="960" rx="28" fill="#f5f8fa"/>
  <text x="62" y="65" class="title">A transfer comes in. SpellBreaker checks the context.</text>
  <text x="64" y="98" class="subtitle">Then it gives the bank a clear next step.</text>

  <rect x="44" y="132" width="1452" height="370" rx="24" fill="#edf4f7" stroke="#d5e2e8"/>
  <text x="72" y="168" class="lane">THE QUICK CHECK</text>

  <!-- Main path: one clear left-to-right line. -->
  <path d="M260 313 H310" class="arrow"/>
  <path d="M485 313 H535" class="arrow"/>
  <path d="M750 313 H785" class="arrow"/>
  <path d="M1040 313 H1075" class="arrow"/>
  <path d="M1275 313 H1310" class="arrow"/>

  <g>
    <rect x="70" y="220" width="190" height="186" rx="18" fill="#fff" stroke="#a8cdd0" stroke-width="1.5"/>
    <rect x="70" y="220" width="190" height="10" rx="5" fill="#438a88"/>
    <text x="92" y="264" class="card-title">Bank app</text>
    <text x="92" y="296" class="body">A transfer is started</text>
    <text x="92" y="324" class="body">Amount · payee · timing</text>
    <text x="92" y="370" class="small">Fictional customer data</text>
  </g>

  <g>
    <rect x="310" y="220" width="175" height="186" rx="18" fill="#fff" stroke="#a9c6d5" stroke-width="1.5"/>
    <rect x="310" y="220" width="175" height="10" rx="5" fill="#4c819a"/>
    <text x="332" y="264" class="card-title">SpellBreaker</text>
    <text x="332" y="296" class="body">Checks the transfer</text>
    <text x="332" y="324" class="body">and returns a decision</text>
    <text x="332" y="370" class="small">Runs on IBM LinuxONE</text>
  </g>

  <g>
    <rect x="535" y="220" width="215" height="186" rx="18" fill="#fff" stroke="#b7c8a7" stroke-width="1.5"/>
    <rect x="535" y="220" width="215" height="10" rx="5" fill="#8a9b69"/>
    <text x="558" y="264" class="card-title">Gather context</text>
    <text x="558" y="296" class="body">Payee history</text>
    <text x="558" y="324" class="body">Recent activity</text>
    <text x="558" y="352" class="body">Receiver risk score</text>
    <text x="558" y="380" class="small">No names in model inputs</text>
  </g>

  <g>
    <rect x="785" y="190" width="255" height="246" rx="18" fill="#fff" stroke="#c8b8df" stroke-width="1.5"/>
    <rect x="785" y="190" width="9" height="246" rx="4.5" fill="#8068a5"/>
    <text x="812" y="222" class="card-title">Three quick checks</text>
    <rect x="812" y="240" width="202" height="48" rx="10" fill="#f7f4fb"/>
    <text x="827" y="261" class="body">Transfer risk</text>
    <text x="827" y="279" class="small">How unusual is it?</text>
    <rect x="812" y="297" width="202" height="48" rx="10" fill="#f7f4fb"/>
    <text x="827" y="318" class="body">Likely scam type</text>
    <text x="827" y="336" class="small">What might be happening?</text>
    <rect x="812" y="354" width="202" height="48" rx="10" fill="#f7f4fb"/>
    <text x="827" y="375" class="body">Receiver risk</text>
    <text x="827" y="393" class="small">Has the account raised flags?</text>
    <text x="812" y="422" class="small">scikit-learn · XGBoost · score lookup</text>
  </g>

  <g>
    <rect x="1075" y="220" width="200" height="186" rx="18" fill="#fff" stroke="#e0c78f" stroke-width="1.5"/>
    <rect x="1075" y="220" width="200" height="10" rx="5" fill="#c49a42"/>
    <text x="1098" y="264" class="card-title">Pick an action</text>
    <text x="1098" y="298" class="body">Allow · ask · pause</text>
    <text x="1098" y="326" class="body">or hold for review</text>
    <text x="1098" y="370" class="small">People make the final call</text>
  </g>

  <g>
    <rect x="1310" y="220" width="160" height="186" rx="18" fill="#fff" stroke="#a8cdd0" stroke-width="1.5"/>
    <rect x="1310" y="220" width="160" height="10" rx="5" fill="#438a88"/>
    <text x="1332" y="264" class="card-title">Bank replies</text>
    <text x="1332" y="298" class="body">Clear message</text>
    <text x="1332" y="326" class="body">plus reasons</text>
    <text x="1332" y="370" class="small">Decision returned to app</text>
  </g>

  <!-- Side paths below the main flow, kept separate so they do not cross. -->
  <text x="72" y="555" class="lane">AFTER THE DECISION</text>

  <path d="M1175 406 V523 H470 V600" class="async"/>
  <text x="800" y="511" class="small" fill="#936b2f">High / critical only · runs in the background</text>
  <g>
    <rect x="70" y="600" width="800" height="224" rx="20" fill="#fffaf1" stroke="#e7d4ad" stroke-width="1.5"/>
    <text x="98" y="640" class="card-title">A short case note (when needed)</text>
    <text x="98" y="672" class="body">Only high or critical decisions get a note, created after the score returns.</text>

    <rect x="98" y="697" width="350" height="94" rx="14" fill="#fff" stroke="#dfc797"/>
    <text x="118" y="728" class="card-title" font-size="17">Granite note · optional</text>
    <text x="118" y="756" class="small">Checks the facts and format; rejects guesses.</text>
    <text x="118" y="777" class="small">If it fails, use the ready-made note.</text>

    <path d="M448 744 H495" class="async"/>
    <rect x="500" y="697" width="340" height="94" rx="14" fill="#fff" stroke="#dfc797"/>
    <text x="520" y="728" class="card-title" font-size="17">Ready-made fallback</text>
    <text x="520" y="756" class="small">Used by default unless Granite is enabled</text>
    <text x="520" y="777" class="small">and its note passes every check.</text>
  </g>

  <path d="M1315 406 V568 H1165 V600" class="arrow"/>
  <g>
    <rect x="940" y="600" width="530" height="224" rx="20" fill="#fff" stroke="#a9c6d5" stroke-width="1.5"/>
    <text x="970" y="640" class="card-title">Fraud analyst dashboard</text>
    <text x="970" y="674" class="body">See decisions, reasons and model evidence.</text>
    <text x="970" y="704" class="body">Check privacy details and case-note status.</text>
    <text x="970" y="752" class="small">The score stays quick; notes are handled separately.</text>
    <text x="970" y="790" class="small">Live view for the bank’s review team</text>
  </g>

  <path d="M870 746 H908 V780 H930" class="async"/>
  <text x="72" y="884" class="small">Case notes use only approved facts such as level, risk band, scam type and reasons. Names, account numbers and raw transaction IDs stay out.</text>
</svg>
